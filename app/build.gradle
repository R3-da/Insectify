plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id "org.jetbrains.kotlin.plugin.compose" version "2.0.20"
}

kotlin {
    sourceSets {
        debug {
            kotlin.srcDir("build/generated/ksp/debug/kotlin")
        }
        release {
            kotlin.srcDir("build/generated/ksp/release/kotlin")
        }
    }
}

android {
    defaultConfig {
        compileSdk 36
        buildToolsVersion = "36.0.0"
        applicationId "com.reda.insectify"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "1.0.8"
//        for using vector drawables
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Only include the ABIs you really need
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a', 'arm64-v8a'  // exclude x86 / x86_64
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        mlModelBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }
    android {
        // other android config...
        packagingOptions {
            resources {
                // Exclude license files
                excludes += '/META-INF/{AL2.0,LGPL2.1}'

                // Exclude x86 and x86_64 native libraries
                excludes += ['/lib/x86/*', '/lib/x86_64/*']
            }
        }
    }
    namespace 'com.reda.insectify'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'org.tensorflow:tensorflow-lite-support:0.5.0'
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.5.0'
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'  // core TFLite runtime
    implementation 'androidx.constraintlayout:constraintlayout-core:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.1.1'
    implementation 'io.github.raamcosta.compose-destinations:animations-core:1.11.9'
    ksp 'io.github.raamcosta.compose-destinations:ksp:2.3.0'
    def nav_version = '2.9.7'
    implementation("androidx.navigation:navigation-compose:$nav_version")

    // splash screen new api
    implementation 'androidx.core:core-splashscreen:1.2.0'

    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2')

    // implement translation library
    implementation 'com.zeugmasolutions.localehelper:locale-helper-android:1.5.1'

    // Pager and Indicators - Accompanist
    implementation "com.google.accompanist:accompanist-pager:$accompanist_version"
    implementation "com.google.accompanist:accompanist-pager-indicators:$accompanist_version"

    // DataStore Preferences
    implementation("androidx.datastore:datastore-preferences:1.2.0")

    // Dagger - Hilt
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    // dagger
    implementation 'com.google.dagger:dagger:2.51.1'
    kapt 'com.google.dagger:dagger-compiler:2.51.1'

    // Dagger - Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-android-compiler:2.51.1'
    implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.3.0"
    kapt 'androidx.hilt:hilt-compiler:1.3.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.13.2'

    // The backported Photo Picker metadata service uses:
    implementation 'com.google.android.gms:play-services-base:18.10.0'
    implementation 'com.google.android.gms:play-services-tasks:18.4.1'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}